name: Build and Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: minilossless-linux64
            asset_extension: .tar.gz
          - os: windows-latest
            artifact_name: minilossless-win64
            asset_extension: .zip
          - os: macos-14
            artifact_name: minilossless-macos
            asset_extension: .zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt pyinstaller

      - name: Download FFmpeg 6.0
        shell: bash
        run: |
          mkdir -p assets/bin
          cd assets/bin
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            curl -L -o ffmpeg.tar.xz "https://github.com/mifi/ffmpeg-builds/releases/download/6.0/ffmpeg-n6.0-12-ga6dc92968a-linux64-gpl-shared-6.0.tar.xz"
            tar -xf ffmpeg.tar.xz
            cp -r ffmpeg-*/bin/* . 2>/dev/null || true
            cp -r ffmpeg-*/lib/* . 2>/dev/null || true
            rm -rf ffmpeg.tar.xz ffmpeg-*
            chmod +x ffmpeg ffprobe 2>/dev/null || true
            
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            curl -L -o ffmpeg.zip "https://github.com/mifi/ffmpeg-builds/releases/download/6.0/ffmpeg-n6.0-12-ga6dc92968a-win64-gpl-shared-6.0.zip"
            unzip -q ffmpeg.zip
            cp ffmpeg-*/bin/* . 2>/dev/null || true
            cp ffmpeg-*/lib/* . 2>/dev/null || true
            rm -rf ffmpeg.zip ffmpeg-*
            
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then
            curl -L -o ffmpeg.zip "https://evermeet.cx/ffmpeg/ffmpeg-6.0.zip"
            curl -L -o ffprobe.zip "https://evermeet.cx/ffmpeg/ffprobe-6.0.zip"
            unzip -q ffmpeg.zip
            unzip -q ffprobe.zip
            rm -rf ffmpeg.zip ffprobe.zip
            chmod +x ffmpeg ffprobe 2>/dev/null || true
          fi

      - name: Download AI Models & Fonts
        shell: bash
        run: |
          mkdir -p assets/models assets/fonts
          python -c "from app.core.asset_manager import ensure_assets_exist; ensure_assets_exist()"
          cd assets/fonts
          curl -L --retry 5 --retry-connrefused -O https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans.ttf
          curl -L --retry 5 --retry-connrefused -O https://github.com/dejavu-fonts/dejavu-fonts/raw/master/ttf/DejaVuSans-Bold.ttf
          curl -L --retry 5 --retry-connrefused -o arial.ttf https://github.com/matomo-org/travis-scripts/raw/master/fonts/Arial.ttf
          curl -L --retry 5 --retry-connrefused -O https://github.com/liberationfonts/liberation-fonts/raw/main/ttf/LiberationSans-Regular.ttf
          curl -L --retry 5 --retry-connrefused -o FreeSans.ttf https://raw.githubusercontent.com/gnu-freefont/freefont/master/subsets/FreeSans.ttf

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "minilossless" \
            --collect-all app \
            --collect-all PyQt6 \
            --collect-all PIL \
            --collect-all cv2 \
            --collect-all mediapipe \
            --exclude-module tkinter \
            --exclude-module sympy \
            --exclude-module fontTools \
            --add-data "assets:assets" \
            main.py

      - name: Archive Release (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          mv minilossless ${{ matrix.artifact_name }}
          tar -czvf ${{ matrix.artifact_name }}${{ matrix.asset_extension }} ${{ matrix.artifact_name }}

      - name: Archive Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Rename-Item -Path "minilossless" -NewName "${{ matrix.artifact_name }}"
          Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}${{ matrix.asset_extension }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.artifact_name }}${{ matrix.asset_extension }}